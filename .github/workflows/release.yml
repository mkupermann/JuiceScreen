name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # required so softprops/action-gh-release can create the draft release

jobs:
  build-dmg:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install tooling
        run: |
          brew bundle --file=Brewfile
          # Log resolved versions so drift in unpinned brew formulas is visible
          # in the workflow output and can be diff'd against past runs.
          echo "Resolved tool versions:"
          xcodegen --version || xcodegen version || true
          create-dmg --version | head -1 || true
          xcbeautify --version || true

      - name: Verify VERSION matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          FILE_VERSION="$(cat VERSION)"
          if [[ "$TAG_VERSION" != "$FILE_VERSION" ]]; then
            echo "❌ Tag $TAG_VERSION does not match VERSION file ($FILE_VERSION)"
            exit 1
          fi
          echo "✅ Version match: $FILE_VERSION"

      - name: Guard against placeholder Sparkle public key
        run: |
          if grep -q 'PLACEHOLDER_GENERATE_IN_PLAN_10' JuiceScreen/Resources/Info.plist; then
            echo "❌ SUPublicEDKey is still the literal placeholder."
            echo "   Generate the EdDSA keypair (see docs/RELEASE.md) and replace"
            echo "   the placeholder in Info.plist + project.yml before tagging."
            exit 1
          fi
          echo "✅ SUPublicEDKey looks like a real key (not the placeholder)"

      - name: Build app
        run: bash scripts/build-release.sh

      - name: Run tests
        run: |
          xcodebuild test \
            -project JuiceScreen.xcodeproj \
            -scheme JuiceScreen \
            -destination 'platform=macOS' \
            -only-testing:JuiceScreenTests \
            | xcbeautify

      - name: Release artefacts are built locally, not here
        run: |
          echo "This workflow verifies that the tagged commit builds and its tests pass."
          echo "It deliberately produces no DMG and creates no release."
          echo
          echo "GitHub runners have no access to the Developer ID certificate, so anything"
          echo "built here is ad-hoc signed — Gatekeeper blocks it on other people's Macs."
          echo "Publishing such a DMG would ship exactly the problem v1.1.1 removed."
          echo
          echo "The shipped DMG is built on the maintainer's Mac: Developer ID signed,"
          echo "notarised, stapled, then EdDSA-signed for Sparkle. See docs/RELEASE.md."
